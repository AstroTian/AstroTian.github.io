<title>Snake 12</title>
<style>
body {
    margin: 0;
    padding: 8px 10px 14px 10px;
    background: #ffffff;
    font-family: Arial, sans-serif;
    color: #24292f;
}
.snake-header {
    width: min(96vw, 1840px);
    box-sizing: border-box;
    margin: 0 auto 6px auto;
    padding: 9px 12px;
    border: 1px solid #d0d7de;
    border-radius: 7px;
    background: #f8fafc;
    font-size: 13px;
    line-height: 1.45;
}
.snake-title {
    font-size: 17px;
    font-weight: 700;
    margin-right: 16px;
}
.snake-meta {
    display: inline-block;
    margin-right: 17px;
}
.orbit-control {
    width: min(96vw, 1840px);
    box-sizing: border-box;
    margin: 0 auto 6px auto;
    padding: 7px 12px;
    border: 1px solid #d8dee4;
    border-radius: 7px;
    background: #ffffff;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    font-size: 12px;
}
.orbit-btn {
    border: 1px solid #8c959f;
    background: #f6f8fa;
    border-radius: 5px;
    padding: 4px 9px;
    cursor: pointer;
}
.orbit-btn:hover {
    background: #eaeef2;
}
#orbit-slider {
    width: min(520px, 55vw);
}
#orbit-time-label {
    display: inline-block;
    min-width: 92px;
    font-weight: 700;
}
.snake-note {
    color: #57606a;
}

/* Keep the complete 2x4 figure centered under the header/control bar.
   The aspect ratio is the same as the designed 1840 x 960 Plotly canvas,
   so the subplot boxes retain their intended nearly-square appearance. */
.snake-plot-center {
    width: min(96vw, 1840px);
    aspect-ratio: 1840 / 960;
    margin: 0 auto;
    position: relative;
    box-sizing: border-box;
    min-width: 0;
}
.snake-plot-center > div {
    width: 100%;
    height: 100%;
}
.snake-plot-center .plotly-graph-div {
    width: 100% !important;
    height: 100% !important;
    margin: 0 auto !important;
}
</style>

    const slider = document.getElementById("orbit-slider");

    async function updateOrbit(k) {
        k = Math.max(0, Math.min(Number(k), orbit.time_abs_myr.length - 1));
        
        const solidX = [];
        const solidY = [];
        const dottedX = [];
        const dottedY = [];
        const markerX = [];
        const markerY = [];
        const markerSymbols = [];
        
        for (const node of nodeList) {
            const ageIdx = Number(node.age_idx);

                solidX.push(node.r.slice(0, k + 1));
                solidY.push(node.z.slice(0, k + 1));
                dottedX.push([]);
                dottedY.push([]);
                markerSymbols.push("square");

                solidY.push(node.z.slice(0, ageIdx + 1));
                dottedX.push(node.r.slice(ageIdx, k + 1));
                dottedY.push(node.z.slice(ageIdx, k + 1));
                markerSymbols.push("triangle-up");
            }
            
            markerX.push([node.r[k]]);
            markerY.push([node.z[k]]);
        }
        
        slider.value = String(k);
        label.textContent = orbit.time_abs_myr[k].toFixed(1) + " Myr";
        
        const jobs = [];
        
        if (solidIndices.length) {
            jobs.push(
                Plotly.restyle(
                    plotDiv,
                    {x: solidX, y: solidY},
                    solidIndices
                )
            );
        }
        
        if (dottedIndices.length) {
            jobs.push(
                Plotly.restyle(
                    plotDiv,
                    {x: dottedX, y: dottedY},
                    dottedIndices
                )
            );
        }

            jobs.push(

                    markerIndices

        }
        
        if (jobs.length) {
            await Promise.all(jobs);
        }

    function scheduleUpdate(k) {

        }

        requestAnimationFrame(flushPending);
    }
    
    async function flushPending() {
        flushScheduled = false;
