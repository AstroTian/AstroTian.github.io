    const slider = document.getElementById("orbit-slider");

        const solidY = [];
        const dottedX = [];
        const dottedY = [];

                    {x: solidX, y: solidY},
                    solidIndices

            );
        }
        
        if (dottedIndices.length) {
            jobs.push(

                    {x: dottedX, y: dottedY},

        }
