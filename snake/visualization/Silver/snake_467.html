        const solidY = [];
        const dottedX = [];
        const dottedY = [];

                dottedX.push(node.r.slice(ageIdx, k + 1));
                dottedY.push(node.z.slice(ageIdx, k + 1));

                    {x: solidX, y: solidY},
                    solidIndices

            );
        }

            jobs.push(
