        const solidY = [];
        const dottedX = [];
        const dottedY = [];

            jobs.push(

                    plotDiv,
                    {x: solidX, y: solidY},
                    solidIndices

            );
        }
        
        if (dottedIndices.length) {
            jobs.push(

                    {x: dottedX, y: dottedY},
                    dottedIndices

        }
