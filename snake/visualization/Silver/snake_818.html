    const slider = document.getElementById("orbit-slider");
    const label = document.getElementById("orbit-time-label");
    const playBtn = document.getElementById("orbit-play");
    const pauseBtn = document.getElementById("orbit-pause");
    const resetBtn = document.getElementById("orbit-reset");
    
    if (!slider || !plotDiv || !orbit.time_abs_myr || orbit.time_abs_myr.length === 0) {
        return;
    }
    
    const nodeList = Object.values(orbit.nodes || {});
    const solidIndices = nodeList.map(n => Number(n.solid_trace));
    const dottedIndices = nodeList.map(n => Number(n.dotted_trace));
    const markerIndices = nodeList.map(n => Number(n.marker_trace));
    
    slider.max = String(orbit.time_abs_myr.length - 1);
    slider.value = String(orbit.default_idx || 0);
    
    let playing = false;
    let playTimer = null;
    let playK = Number(slider.value);
    
    let updating = false;
    let pendingK = null;
    let flushScheduled = false;
    
    async function updateOrbit(k) {
        k = Math.max(0, Math.min(Number(k), orbit.time_abs_myr.length - 1));
        
        const solidX = [];
        const solidY = [];
        const dottedX = [];
        const dottedY = [];
        const markerX = [];
        const markerY = [];
        const markerSymbols = [];
        
        for (const node of nodeList) {
            const ageIdx = Number(node.age_idx);
            
            if (k <= ageIdx) {
                solidX.push(node.r.slice(0, k + 1));
                solidY.push(node.z.slice(0, k + 1));
                dottedX.push([]);
                dottedY.push([]);
                markerSymbols.push("square");
            } else {
                solidX.push(node.r.slice(0, ageIdx + 1));
                solidY.push(node.z.slice(0, ageIdx + 1));
                dottedX.push(node.r.slice(ageIdx, k + 1));
                dottedY.push(node.z.slice(ageIdx, k + 1));
                markerSymbols.push("triangle-up");
            }
            
            markerX.push([node.r[k]]);
            markerY.push([node.z[k]]);
        }
        
        slider.value = String(k);
        label.textContent = orbit.time_abs_myr[k].toFixed(1) + " Myr";
        
        const jobs = [];
        
        if (solidIndices.length) {
            jobs.push(
                Plotly.restyle(
                    plotDiv,
                    {x: solidX, y: solidY},
                    solidIndices
                )
            );
        }
        
        if (dottedIndices.length) {
            jobs.push(
                Plotly.restyle(
                    plotDiv,
                    {x: dottedX, y: dottedY},
                    dottedIndices
                )
            );
        }
        
        if (markerIndices.length) {
            jobs.push(
                Plotly.restyle(
                    plotDiv,
                    {
                        x: markerX,
                        y: markerY,
                        "marker.symbol": markerSymbols
                    },
                    markerIndices
                )
            );
        }
        
        if (jobs.length) {
            await Promise.all(jobs);
        }
    }
    
    function scheduleUpdate(k) {
        pendingK = Number(k);
        
        if (flushScheduled || updating) {
            return;
        }
        
        flushScheduled = true;
        requestAnimationFrame(flushPending);
    }
    
    async function flushPending() {
        flushScheduled = false;
        
        if (updating || pendingK === null) {
            return;
        }
        
        const k = pendingK;
        pendingK = null;
        updating = true;

                requestAnimationFrame(flushPending);
            }

        playing = true;
        playK = Number(slider.value);
        
        playTimer = setInterval(function() {

            }
            
            scheduleUpdate(playK);
        }, 32);
    });
    
    pauseBtn.addEventListener("click", function() {
        playing = false;
        if (playTimer !== null) {
            clearInterval(playTimer);
            playTimer = null;
        }
    });
    
    resetBtn.addEventListener("click", function() {
        playing = false;
