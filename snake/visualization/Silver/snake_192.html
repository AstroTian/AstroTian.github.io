<style>
body {

.snake-header {
    width: min(96vw, 1840px);
    box-sizing: border-box;
    margin: 0 auto 6px auto;
    padding: 9px 12px;
    border: 1px solid #d0d7de;
    border-radius: 7px;

}
.snake-meta {
    display: inline-block;
    margin-right: 17px;
}
.orbit-control {
    width: min(96vw, 1840px);
    box-sizing: border-box;
    margin: 0 auto 6px auto;
    padding: 7px 12px;

    border-radius: 7px;
    background: #ffffff;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    font-size: 12px;
}
.orbit-btn {
    border: 1px solid #8c959f;
    background: #f6f8fa;
    border-radius: 5px;
    padding: 4px 9px;
    cursor: pointer;
}
.orbit-btn:hover {
    background: #eaeef2;
}
#orbit-slider {
    width: min(520px, 55vw);
}
#orbit-time-label {
    display: inline-block;
    min-width: 92px;
    font-weight: 700;
}
.snake-note {
    color: #57606a;
}

/* Keep the complete 2x4 figure centered under the header/control bar.

   so the subplot boxes retain their intended nearly-square appearance. */
.snake-plot-center {

    aspect-ratio: 1840 / 960;
    margin: 0 auto;
    position: relative;
    box-sizing: border-box;
    min-width: 0;
}
.snake-plot-center > div {
    width: 100%;
    height: 100%;
}
.snake-plot-center .plotly-graph-div {
    width: 100% !important;
    height: 100% !important;
    margin: 0 auto !important;
}
</style>
