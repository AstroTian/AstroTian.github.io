.snake-header {

.snake-meta {

    margin: 0 auto 6px auto;

    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    font-size: 12px;
}
.orbit-btn {
    border: 1px solid #8c959f;
    background: #f6f8fa;
    border-radius: 5px;
    padding: 4px 9px;
    cursor: pointer;
}
.orbit-btn:hover {
    background: #eaeef2;
}
#orbit-slider {
    width: min(520px, 55vw);
}
#orbit-time-label {
    display: inline-block;
    min-width: 92px;
    font-weight: 700;
}
.snake-note {
    color: #57606a;
}

/* Keep the complete 2x4 figure centered under the header/control bar.

   so the subplot boxes retain their intended nearly-square appearance. */
.snake-plot-center {
    width: min(96vw, 1840px);
    aspect-ratio: 1840 / 960;
    margin: 0 auto;
    position: relative;
    box-sizing: border-box;
    min-width: 0;
}
.snake-plot-center > div {
    width: 100%;
    height: 100%;
}
.snake-plot-center .plotly-graph-div {
    width: 100% !important;
    height: 100% !important;
    margin: 0 auto !important;
}

        }
        
        slider.value = String(k);
        label.textContent = orbit.time_abs_myr[k].toFixed(1) + " Myr";
        
        const jobs = [];
        
        if (solidIndices.length) {
            jobs.push(
                Plotly.restyle(
                    plotDiv,
                    {x: solidX, y: solidY},
                    solidIndices
                )
            );
        }
        
        if (dottedIndices.length) {
            jobs.push(
                Plotly.restyle(
                    plotDiv,
                    {x: dottedX, y: dottedY},
                    dottedIndices
                )
            );
        }
        
        if (markerIndices.length) {
            jobs.push(
                Plotly.restyle(
                    plotDiv,
                    {
                        x: markerX,
                        y: markerY,
                        "marker.symbol": markerSymbols
                    },
                    markerIndices
                )
            );
        }
        
        if (jobs.length) {
            await Promise.all(jobs);
        }
    }
    
    function scheduleUpdate(k) {
        pendingK = Number(k);
        
        if (flushScheduled || updating) {
            return;
        }
        
        flushScheduled = true;
        requestAnimationFrame(flushPending);
    }
    
    async function flushPending() {
        flushScheduled = false;
        
        if (updating || pendingK === null) {
            return;
        }
        
        const k = pendingK;
        pendingK = null;
        updating = true;
        
        try {
            await updateOrbit(k);
        } finally {
            updating = false;
            
            // If the user dragged farther while Plotly was rendering, jump
            // directly to the newest requested point instead of replaying all
            // intermediate events.
            if (pendingK !== null && !flushScheduled) {
                flushScheduled = true;
                requestAnimationFrame(flushPending);
            }
        }
    }
    
    slider.addEventListener("input", function() {
        playK = Number(slider.value);
        scheduleUpdate(playK);
    });
    
    playBtn.addEventListener("click", function() {
        if (playing) return;
        playing = true;
        playK = Number(slider.value);
        
        playTimer = setInterval(function() {
            playK += 4;
            
            // One-pass playback: show the last sample and then pause.
            if (playK >= orbit.time_abs_myr.length - 1) {
                playK = orbit.time_abs_myr.length - 1;
                scheduleUpdate(playK);
                
                playing = false;
                clearInterval(playTimer);
                playTimer = null;
                return;
            }
            
            scheduleUpdate(playK);
        }, 32);
    });
    
    pauseBtn.addEventListener("click", function() {
        playing = false;
        if (playTimer !== null) {
            clearInterval(playTimer);
            playTimer = null;
        }
    });
    
    resetBtn.addEventListener("click", function() {
        playing = false;
        if (playTimer !== null) {
            clearInterval(playTimer);
            playTimer = null;
        }
        playK = Number(orbit.default_idx || 0);
        scheduleUpdate(playK);
    });
    
    scheduleUpdate(Number(orbit.default_idx || 0));
})();
</script>
