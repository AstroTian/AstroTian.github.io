    padding: 4px 9px;

.orbit-btn:hover {

}

    display: inline-block;

}
.snake-note {
    color: #57606a;
}

    position: relative;
    box-sizing: border-box;
    min-width: 0;
}
.snake-plot-center > div {
    width: 100%;
    height: 100%;
}
.snake-plot-center .plotly-graph-div {
    width: 100% !important;
    height: 100% !important;
    margin: 0 auto !important;

        const solidY = [];
        const dottedX = [];
