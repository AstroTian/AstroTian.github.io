    padding: 4px 9px;

}
.orbit-btn:hover {
    background: #eaeef2;
}

    width: min(520px, 55vw);
}
#orbit-time-label {
    display: inline-block;
    min-width: 92px;
    font-weight: 700;
}
.snake-note {
    color: #57606a;
}

    margin: 0 auto;
    position: relative;
    box-sizing: border-box;
    min-width: 0;
}
.snake-plot-center > div {
    width: 100%;
    height: 100%;
}
.snake-plot-center .plotly-graph-div {
    width: 100% !important;
    height: 100% !important;
    margin: 0 auto !important;
}
