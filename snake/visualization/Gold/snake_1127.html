        playTimer = setInterval(function() {
            playK += 4;
            
            // One-pass playback: show the last sample and then pause.
            if (playK >= orbit.time_abs_myr.length - 1) {
                playK = orbit.time_abs_myr.length - 1;
                scheduleUpdate(playK);
                
                playing = false;
                clearInterval(playTimer);
                playTimer = null;
                return;
            }
            
            scheduleUpdate(playK);
        }, 32);
    });
    
    pauseBtn.addEventListener("click", function() {
        playing = false;
        if (playTimer !== null) {
            clearInterval(playTimer);
            playTimer = null;
        }
    });
    
    resetBtn.addEventListener("click", function() {
        playing = false;
        if (playTimer !== null) {
            clearInterval(playTimer);
            playTimer = null;
        }
        playK = Number(orbit.default_idx || 0);
        scheduleUpdate(playK);
    });
    
    scheduleUpdate(Number(orbit.default_idx || 0));
})();
</script>


</body>
</html>
